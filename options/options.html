<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Thai PDPA Guard</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1 data-i18n="extName"></h1>
  <p class="note" data-i18n="privacyNote"></p>

  <fieldset>
    <legend data-i18n="modeLabel"></legend>
    <label><input type="radio" name="mode" value="warn"> <span data-i18n="modeWarn"></span></label>
    <label><input type="radio" name="mode" value="auto"> <span data-i18n="modeAuto"></span></label>
    <label><input type="radio" name="mode" value="block"> <span data-i18n="modeBlock"></span></label>
  </fieldset>

  <fieldset>
    <legend data-i18n="detectorsLabel"></legend>
    <div id="detectors"></div>
  </fieldset>

  <fieldset>
    <legend>Gemini Nano</legend>
    <label><input type="checkbox" id="useNano"> <span data-i18n="nanoLabel"></span></label>
    <p id="nanoStatus" class="note"></p>
  </fieldset>

  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="options.js"></script>
</body>
</html>
