<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Thai PDPA Guard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1 data-i18n="extName"></h1>
  <p class="note" data-i18n="privacyNote"></p>
  <section>
    <h2 data-i18n="statsTitle"></h2>
    <p><span data-i18n="statsTotal"></span>: <strong id="total">0</strong></p>

  <script type="module" src="popup.js"></script>

</html>
