<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: "Leelawadee UI", "Noto Sans Thai", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    color: #fff; display: flex; align-items: center; padding: 0 22px 0 18px; box-sizing: border-box; gap: 16px;
  }
  img { width: 128px; height: 128px; flex: none; filter: drop-shadow(0 6px 16px rgba(0,0,0,.45)); }
  h1 { font-size: 35px; margin: 0; line-height: 1.22; font-weight: 700; letter-spacing: -.3px; }
  h1 em { font-style: normal; color: #fbbf24; }
  .sites { margin: 8px 0 0; font-size: 17px; color: #c7d7fe; font-weight: 600; }
  .tag { display: inline-block; margin-top: 12px; padding: 5px 14px; border-radius: 999px; background: #fbbf24; color: #1e3a8a; font-weight: 700; font-size: 18px; }
</style>
</head>
<body>
  <img src="icon-source.png" alt="">
  <div>
    <h1>ปิดบังข้อมูลลูกค้า<br>ก่อนส่งให้ <em>AI</em></h1>
    <div class="sites">ChatGPT · Claude · Gemini</div>
    <span class="tag">ทำงานในเครื่อง · ฟรี</span>
  </div>
</body>
</html>
